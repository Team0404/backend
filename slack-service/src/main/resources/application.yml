server:
  port: 19096

spring:
  application:
    name: slack-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:slack_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:public}
    clean-disabled: true
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
        format_sql: true
  ai:
    # AI 발송시한 산출 (A1/A4, Gemini Developer API)
    # ⚠️ 모델명은 구글이 예고 없이 지원을 중단한다(gemini-2.0-flash / gemini-2.5-flash 모두 404 확인).
    #    버전 고정 대신 별칭(-latest)을 기본값으로 두어 중단에 덜 취약하게 한다.
    google:
      genai:
        api-key: ${GEMINI_API_KEY:your-api-key}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-flash-latest}
            temperature: 0.2
    retry:
      max-attempts: 0

# 슬랙 메시지 발송 (Incoming Webhook 또는 Bot Token)
slack:
  token: ${SLACK_BOT_TOKEN:}
  webhook-url: ${SLACK_WEBHOOK_URL:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
