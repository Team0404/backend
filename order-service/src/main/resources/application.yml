server:
  port: 19094

spring:
  application:
    name: order-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${ORDER_SAGA_FEIGN_CONNECT_TIMEOUT:1000}
            readTimeout: ${ORDER_SAGA_FEIGN_READ_TIMEOUT:5000}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:public}
    clean-disabled: true
    validate-migration-naming: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  saga:
    retry:
      max-attempts: ${ORDER_SAGA_RETRY_MAX_ATTEMPTS:3}
      wait-duration-ms: ${ORDER_SAGA_RETRY_WAIT_DURATION_MS:200}
      exponential-backoff-multiplier: ${ORDER_SAGA_RETRY_EXPONENTIAL_BACKOFF_MULTIPLIER:2.0}
