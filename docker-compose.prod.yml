# 운영(EC2) 배포용 compose.
# 앱 이미지는 GitHub Actions가 GHCR(ghcr.io/team0404/*)에 push한 것을 pull 한다.
# 외부에 개방되는 포트는 gateway(8080) 하나뿐 — 나머지는 compose 내부 네트워크로만 통신.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# 필요한 값은 같은 폴더의 .env 에서 주입 (DB_PASSWORD, JWT_SECRET 등)

services:
  # ---------------- 인프라 (외부 포트 미개방) ----------------
  postgres:
    image: postgres:16-alpine
    container_name: sparta-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # hub-service 캐시 전용 Redis
  hub-redis:
    image: redis:7-alpine
    container_name: sparta-hub-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # company-service 캐시 전용 Redis
  company-redis:
    image: redis:7-alpine
    container_name: sparta-company-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # user-service Refresh Token 전용 Redis
  user-redis:
    image: redis:7-alpine
    container_name: sparta-user-redis
    command: redis-server --appendonly yes
    volumes:
      - user-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: sparta-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped

  # ---------------- 앱 (GHCR 이미지) ----------------
  eureka:
    image: ghcr.io/team0404/eureka-service:latest
    container_name: sparta-eureka
    ports:
      - "8761:8761"
    restart: unless-stopped

  gateway:
    image: ghcr.io/team0404/gateway-service:latest
    container_name: sparta-gateway
    ports:
      - "8080:8080"          # ★ 외부 진입점만 개방
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      JWT_SECRET: ${JWT_SECRET}
      USER_REDIS_HOST: user-redis
      USER_REDIS_PORT: 6379
    depends_on:
      - eureka
      - user-redis
    restart: unless-stopped

  user-service:
    image: ghcr.io/team0404/user-service:latest
    container_name: sparta-user
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: user_service
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      USER_REDIS_HOST: user-redis
      USER_REDIS_PORT: 6379
      EUREKA_URL: http://eureka:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - user-redis
      - eureka
    restart: unless-stopped

  hub-service:
    image: ghcr.io/team0404/hub-service:latest
    container_name: sparta-hub
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hub_service
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: public
      DDL_AUTO: validate
      SHOW_SQL: "false"
      HUB_REDIS_HOST: hub-redis
      HUB_REDIS_PORT: 6379
      EUREKA_URL: http://eureka:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      hub-redis:
        condition: service_healthy
      eureka:
        condition: service_started
    restart: unless-stopped

  company-service:
    image: ghcr.io/team0404/company-service:latest
    container_name: sparta-company
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: company_service
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: public
      DDL_AUTO: validate
      SHOW_SQL: "false"
      COMPANY_REDIS_HOST: company-redis
      COMPANY_REDIS_PORT: 6379
      EUREKA_URL: http://eureka:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      company-redis:
        condition: service_healthy
      eureka:
        condition: service_started
      hub-service:
        condition: service_started
    restart: unless-stopped

  delivery-service:
    image: ghcr.io/team0404/delivery-service:latest
    container_name: sparta-delivery
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: delivery_service
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: public
      DDL_AUTO: validate
      SHOW_SQL: "false"
      EUREKA_URL: http://eureka:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      - postgres
      - eureka
      - hub-service
    restart: unless-stopped

  slack-service:
    image: ghcr.io/team0404/slack-service:latest
    container_name: sparta-slack
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: slack_service
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: public
      DDL_AUTO: validate
      SHOW_SQL: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      EUREKA_URL: http://eureka:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      - postgres
      - eureka
    restart: unless-stopped

  order-service:
    image: ghcr.io/team0404/order-service:latest
    container_name: sparta-order
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: order_service
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: public
      DDL_AUTO: validate
      SHOW_SQL: "false"
      EUREKA_URL: http://eureka:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      - postgres
      - eureka
      - company-service
      - delivery-service
      - slack-service
    restart: unless-stopped

volumes:
  postgres-data:
  user-redis-data:
