// 공통 모듈: 실행 가능한 부트 애플리케이션이 아니라 라이브러리 jar로 빌드
bootJar {
    enabled = false
}
jar {
    enabled = true
}

dependencies {
    // 컴파일에만 필요 (각 서비스가 런타임 의존성을 이미 보유하므로 compileOnly)
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
    // feignClient에서 api 호출시 내부 호출 인식
    compileOnly 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // QueryDSL - BaseEntity가 @MappedSuperclass라서, 이걸 상속하는 각 서비스의
    // Entity(Company, Product, Hub, Order 등)의 Q타입이 QBaseEntity를 참조하려면
    // common 모듈 자체에서도 QBaseEntity가 미리 생성되어 있어야 합니다.
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:6.11'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:6.11:jpa'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}
